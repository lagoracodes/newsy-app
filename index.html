<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newsy | authentication</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body>
    <div class="min-h-screen flex flex-col items-center">
      <header class="w-full flex flex-col items-center pt-12">
        <img
          src="assets/images/newsy-logo.svg"
          class="w-16 h-auto object-contain p-2"
          alt="newsy logo"
        />
        <h1 class="text-center text-2xl">
          Welcome<br />to<br />
          <img
            src="assets/images/newsy-dark.svg"
            class="h-8 object-contain inline-block"
            alt="newsy"
          />
        </h1>
      </header>
      <main class="w-full flex-1 flex items-center justify-center p-6 -mt-12">
        <form
          id="loginForm"
          action="pages/feed/index.html"
          class="w-full max-w-md px-8 py-6 border border-gray-300/50 rounded-lg flex flex-col items-center space-y-6 bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.03)]"
        >
          <div class="w-full">
            <label for="email" class="block text-gray-700 mb-2 font-medium"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="Enter your email"
            />
          </div>
          <div class="w-full">
            <label for="password" class="block text-gray-700 mb-2 font-medium"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="Enter your password (min 8 characters)"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 font-medium transition-colors"
          >
            Log In
          </button>
          <p class="text-gray-600">
            Don't have an account?
            <a
              href="#"
              class="text-blue-500 hover:text-blue-600 font-medium"
              onclick="toggleForm()"
              >Sign Up</a
            >
          </p>
        </form>

        <form
          id="registerForm"
          action="pages/feed/index.html"
          class="w-full max-w-md px-8 py-6 border border-gray-300/50 rounded-lg items-center space-y-6 bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.03)] hidden"
        >
          <div class="w-full">
            <label
              for="registerName"
              class="block text-gray-700 mb-2 font-medium"
              >Full Name</label
            >
            <input
              type="text"
              id="registerName"
              name="name"
              required
              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="Enter your full name"
            />
          </div>
          <div class="w-full">
            <label
              for="registerUsername"
              class="block text-gray-700 mb-2 font-medium"
              >Username</label
            >
            <div class="relative">
              <span class="absolute left-3 top-3 text-gray-500">@</span>
              <input
                type="text"
                id="registerUsername"
                name="username"
                required
                class="w-full p-3 pl-8 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                placeholder="Choose a username"
              />
            </div>
          </div>
          <div class="w-full">
            <label
              for="registerEmail"
              class="block text-gray-700 mb-2 font-medium"
              >Email</label
            >
            <input
              type="email"
              id="registerEmail"
              name="email"
              required
              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="Enter your email"
            />
          </div>
          <div class="w-full">
            <label
              for="registerPassword"
              class="block text-gray-700 mb-2 font-medium"
              >Password</label
            >
            <input
              type="password"
              id="registerPassword"
              name="password"
              required
              minlength="8"
              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="Enter your password (min 8 characters)"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 font-medium transition-colors"
          >
            Sign Up
          </button>
          <p class="text-gray-600">
            Already have an account?
            <a
              href="#"
              class="text-blue-500 hover:text-blue-600 font-medium"
              onclick="toggleForm()"
              >Log In</a
            >
          </p>
        </form>
      </main>
      <footer class="w-full flex justify-center py-4">
        <p class="text-gray-700">© 2025 Newsy. All rights reserved.</p>
      </footer>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
