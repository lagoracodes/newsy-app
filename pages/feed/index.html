<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newsy | feed</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body>
    <div
      id="newPostOverlay"
      class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 hidden"
    >
      <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">Create New Post</h2>
          <button
            onclick="toggleNewPostOverlay()"
            class="text-gray-500 hover:text-blue-500 transition-colors"
          >
            ✕
          </button>
        </div>
        <form class="space-y-4">
          <div>
            <label for="postTitle" class="block text-gray-700 mb-2"
              >Title</label
            >
            <input
              type="text"
              id="postTitle"
              name="title"
              class="w-full p-2 border rounded-lg"
              required
              minlength="3"
              maxlength="100"
              placeholder="Enter your post title"
            />
          </div>
          <div>
            <label for="postContent" class="block text-gray-700 mb-2"
              >Content</label
            >
            <textarea
              id="postContent"
              name="content"
              class="w-full p-2 border rounded-lg h-32"
              required
              minlength="10"
              maxlength="1000"
              placeholder="Write your post content here..."
            ></textarea>
          </div>
          <div class="flex justify-end space-x-2">
            <button
              type="button"
              onclick="toggleNewPostOverlay()"
              class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
            >
              Post
            </button>
          </div>
        </form>
      </div>
    </div>
    <div
      id="articleOverlay"
      class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 hidden"
    >
      <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-2xl mx-4">
        <div class="flex justify-between items-start mb-4">
          <div class="flex items-center space-x-3">
            <img
              src="../../assets/images/blank-profile-picture.png"
              alt="Author"
              class="w-12 h-12 rounded-full object-cover cursor-pointer hover:opacity-90 transition-opacity"
            />
            <div>
              <h2 id="articleTitle" class="text-xl font-bold"></h2>
              <div class="flex flex-col space-y-2">
                <div class="flex items-center space-x-2 text-sm text-gray-500">
                  <span id="articleUsername" class="text-gray-400"></span>
                </div>
                <button
                  id="followButton"
                  class="hidden px-3 py-0.5 bg-blue-500 text-white text-xs rounded-lg hover:bg-blue-600 transition-colors w-fit"
                >
                  Follow
                </button>
              </div>
            </div>
          </div>
          <button
            onclick="toggleArticleOverlay()"
            class="text-gray-500 hover:text-blue-500 transition-colors"
          >
            ✕
          </button>
        </div>
        <div id="articleContent" class="prose max-w-none"></div>
        <div class="mt-4 text-xs text-gray-400 flex items-center space-x-2">
          <span>•</span>
          <span id="articleTime"></span>
        </div>
      </div>
    </div>
    <div
      id="editPostOverlay"
      class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 hidden"
    >
      <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">Edit Post</h2>
          <button
            onclick="toggleEditPostOverlay()"
            class="text-gray-500 hover:text-blue-500 transition-colors"
          >
            ✕
          </button>
        </div>
        <form class="space-y-4">
          <input type="hidden" id="editPostId" />
          <div>
            <label for="editPostTitle" class="block text-gray-700 mb-2"
              >Title</label
            >
            <input
              type="text"
              id="editPostTitle"
              name="title"
              class="w-full p-2 border rounded-lg"
              required
              minlength="3"
              maxlength="100"
              placeholder="Enter your post title"
            />
          </div>
          <div>
            <label for="editPostContent" class="block text-gray-700 mb-2"
              >Content</label
            >
            <textarea
              id="editPostContent"
              name="content"
              class="w-full p-2 border rounded-lg h-32"
              required
              minlength="10"
              maxlength="1000"
              placeholder="Write your post content here..."
            ></textarea>
          </div>
          <div class="flex justify-end space-x-2">
            <button
              type="button"
              onclick="toggleEditPostOverlay()"
              class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="min-h-screen flex flex-col items-center">
      <header class="w-full flex flex-row items-center justify-between px-4">
        <div
          onclick="toggleSidebar()"
          class="flex flex-col space-y-1 cursor-pointer p-2"
          data-hamburger
        >
          <div class="w-6 h-1 bg-gray-600"></div>
          <div class="w-6 h-1 bg-gray-600"></div>
          <div class="w-6 h-1 bg-gray-600"></div>
        </div>
        <div
          id="sidebar"
          class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-[200]"
        >
          <div class="p-4">
            <h2 class="text-xl font-bold mb-4">Menu</h2>
            <nav class="space-y-2">
              <a
                href="./index.html"
                class="block hover:text-blue-500 font-medium underline decoration-blue-500 decoration-2 underline-offset-4"
              >
                Home
              </a>
              <a href="../profile/index.html" class="block hover:text-blue-500"
                >Profile</a
              >
              <a href="#" onclick="logout()" class="block hover:text-blue-500"
                >Logout</a
              >
            </nav>
          </div>
        </div>
        <div class="flex flex-col items-center">
          <a href="./index.html">
            <img
              src="../../assets/images/newsy-logo.svg"
              class="w-16 h-auto object-contain p-2"
              alt="newsy logo"
            />
          </a>
          <a href="./index.html">
            <img
              src="../../assets/images/newsy-dark.svg"
              class="h-8 object-contain"
              alt="newsy"
            />
          </a>
        </div>
        <a
          href="../profile/index.html"
          class="w-10 h-10 rounded-full overflow-hidden border-2 border-gray-200"
        >
          <img
            src="../../assets/images/blank-profile-picture.png"
            alt="Profile"
            class="w-full h-full object-cover"
          />
        </a>
      </header>
      <main class="w-full flex-1 flex flex-col items-center p-4 space-y-4">
        <div class="w-full max-w-2xl">
          <input
            type="search"
            id="searchInput"
            placeholder="Search tech news..."
            class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors"
            oninput="searchBar()"
          />
        </div>

        <div
          class="w-full max-w-2xl flex justify-between items-center relative"
        >
          <div class="relative">
            <button
              onclick="toggleSort()"
              class="px-4 py-2 bg-gray-100 rounded-lg border border-gray-300 hover:bg-gray-200 transition-colors flex items-center space-x-2"
            >
              <span>Sort by</span>
              <span>↓</span>
            </button>
            <div
              id="sortMenu"
              class="hidden absolute top-12 left-0 w-48 bg-white border border-gray-300 rounded-lg shadow-lg z-[100]"
            >
              <button
                onclick="sortBy('newest')"
                class="w-full text-left px-4 py-2 hover:bg-gray-100"
              >
                Newest First
              </button>
              <button
                onclick="sortBy('oldest')"
                class="w-full text-left px-4 py-2 hover:bg-gray-100"
              >
                Oldest First
              </button>
              <button
                onclick="sortBy('title')"
                class="w-full text-left px-4 py-2 hover:bg-gray-100"
              >
                Title A-Z
              </button>
            </div>
          </div>

          <button
            onclick="toggleNewPostOverlay()"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center space-x-2"
          >
            <span>New Post</span>
            <span>+</span>
          </button>
        </div>

        <div id="newsContainer" class="w-full max-w-2xl space-y-4"></div>
      </main>

      <footer class="w-full flex justify-center py-4 mt-auto">
        <p class="text-gray-700">© 2025 Newsy. All rights reserved.</p>
      </footer>
    </div>

    <script src="../../js/feed.js" type="module"></script>

    <style>
      #newsContainer > div {
        transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
      }
    </style>
  </body>
</html>
